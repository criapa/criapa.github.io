<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviado com sucesso - CRIAPA Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(160deg,#0a1628 0%,#0C2D5E 60%,#0d2137 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:48px 32px;max-width:480px;width:100%}
.icon{width:64px;height:64px;background:linear-gradient(135deg,#269ab6,#00c48c);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.icon svg{width:32px;height:32px;fill:#fff}
h1{font-size:1.5rem;font-weight:700;margin-bottom:12px}
p{color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:24px}
a{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#269ab6,#00c48c);color:#fff;text-decoration:none;border-radius:50px;font-weight:600;transition:transform .2s}
a:hover{transform:scale(1.02)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  </div>
  <h1>Consulta enviada com sucesso!</h1>
  <p>Obrigado pela confiança! Em até 24h iremos trazer todas as informações importantes e trilhar a estratégia que mais se adapta à sua marca.</p>
  <a href="https://criapa.github.io/">Voltar ao site</a>
</div>
</body>
</html>
